[project]
name = "py-pieces"
version = "2026.10.0"
description = "Python code pieces"
requires-python = ">=3.15"
dependencies = [
  "anyio>=4.16.0",
  "orjson>=3.13.0",
  "polars>=2.1.0",
  "pydantic>=2.14.3",
  "trio>=0.35.0",
]

[dependency-groups]
dev = [
  "ruff>=0.17.4",
  "ty>=0.0.99"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.sources]
"src" = "ulib"

[tool.hatch.build.targets.wheel]
packages = ["src/ulib"]

[tool.uv]
python-preference = "managed"
prerelease = "if-necessary"
resolution = "highest"
